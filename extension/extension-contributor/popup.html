<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adobe Contributor Portfolio Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="glass-container">
    <!-- Top Navigation Bar -->
    <header class="app-header">
      <div class="brand-group">
        <span class="live-dot" title="Connected to Active Tab"></span>
        <h1 class="brand-title">Portfolio Extractor</h1>
      </div>
      <div class="platform-capsule">Contributor</div>
    </header>

    <!-- Query Info & Metric Capsule Card -->
    <section class="glass-card query-card">
      <div class="card-header-row">
        <span class="micro-label">PORTFOLIO GRID</span>
        <div class="pill-group">
          <span class="badge-pill badge-emerald" id="count-pill">Scanning...</span>
          <span class="badge-pill badge-amber" id="nominate-pill" style="display: none;">⭐ 0 Nominate</span>
        </div>
      </div>
      <div class="query-display" id="query-display">Adobe Contributor</div>
    </section>

    <!-- Main Fast Actions Grid -->
    <section class="actions-section">
      <!-- 1. Copy Nominate IDs -->
      <button id="copy-nominate-ids-btn" class="btn btn-nominate" data-testid="contributor-copy-nominate-ids-btn" disabled>
        <span class="btn-icon">⭐</span>
        <div class="btn-body">
          <div class="btn-title" id="nominate-btn-title">Copy Nominate IDs (0)</div>
          <div class="btn-subtitle">Free Collection eligible only</div>
        </div>
      </button>

      <!-- 2. Copy All Asset IDs -->
      <button id="copy-all-ids-btn" class="btn btn-primary" data-testid="contributor-copy-all-ids-btn" disabled>
        <span class="btn-icon">📋</span>
        <div class="btn-body">
          <div class="btn-title" id="all-btn-title">Copy All Asset IDs (0)</div>
          <div class="btn-subtitle">All artworks on this page</div>
        </div>
      </button>

      <!-- Secondary Data Export Row -->
      <div class="tertiary-btn-row">
        <button id="copy-tsv-btn" class="btn btn-tertiary" data-testid="contributor-copy-tsv-btn" title="Copy full table with titles and downloads">
          <span>📊 TSV</span>
        </button>
        <button id="download-csv-btn" class="btn btn-tertiary" data-testid="contributor-download-csv-btn" title="Download CSV file">
          <span>📥 CSV</span>
        </button>
        <button id="copy-json-btn" class="btn btn-tertiary" data-testid="contributor-copy-json-btn" title="Copy raw JSON payload">
          <span>📦 JSON</span>
        </button>
      </div>
    </section>

    <!-- Floating Toast Notification -->
    <div id="toast" class="modern-toast">Copied to clipboard!</div>

    <!-- Footer -->
    <footer class="app-footer">
      <span>100% Client-Side • Zero Network Overhead</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
